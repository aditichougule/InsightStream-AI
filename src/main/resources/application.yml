spring:
  application:
    name: ai-video-intelligence-platform
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true
    open-in-view: false
  datasource:
    url: jdbc:postgresql://localhost:5432/ai_video_ip
    username: postgres
    password: postgres
    driver-class-name: org.postgresql.Driver
  jackson:
    serialization:
      write-dates-as-timestamps: false
    deserialization:
      fail-on-unknown-properties: false
  servlet:
    multipart:
      max-file-size: 5GB
      max-request-size: 5GB

server:
  port: 8080
  servlet:
    context-path: /api

logging:
  level:
    root: INFO
    com.aivideoip: DEBUG
    org.springframework.web: DEBUG
    org.springframework.security: DEBUG
  pattern:
    console: "%d{HH:mm:ss.SSS} [%thread] %-5level %logger{36} - %msg%n"

app:
  name: AI Video Intelligence Platform
  version: 1.0.0
  jwt:
    secret: your-secret-key-change-in-production-min-32-chars
    expiration: 86400000  # 24 hours in milliseconds
  cors:
    allowed-origins: http://localhost:3000,http://localhost:8080
    allowed-methods: GET,POST,PUT,DELETE,OPTIONS,PATCH
    allowed-headers: "*"
    allow-credentials: true
  upload:
    video-dir: uploads/videos
    max-file-size: 5368709120  # 5GB in bytes
  ytdlp:
    enabled: true
    path: yt-dlp
  ffmpeg:
    enabled: true
    path: ffmpeg
  audio:
    output-dir: uploads/audio
    format: mp3
    bitrate: 128k
  whisper:
    enabled: true
    service-url: http://localhost:5000
