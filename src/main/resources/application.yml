spring:
  application:
    name: ai-video-intelligence-platform
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true
    open-in-view: false
  datasource:
    url: jdbc:postgresql://localhost:5432/ai_video_ip
    username: postgres
    password: postgres
    driver-class-name: org.postgresql.Driver
  jackson:
    serialization:
      write-dates-as-timestamps: false
    deserialization:
      fail-on-unknown-properties: false
  servlet:
    multipart:
      max-file-size: 5GB
      max-request-size: 5GB

server:
  port: 8080
  servlet:
    context-path: /api

logging:
  level:
    root: INFO
    com.aivideoip: DEBUG
    org.springframework.web: DEBUG
    org.springframework.security: DEBUG
  pattern:
    console: "%d{HH:mm:ss.SSS} [%thread] %-5level %logger{36} - %msg%n"

app:
  name: AI Video Intelligence Platform
  version: 1.0.0
  jwt:
    secret: your-secret-key-change-in-production-min-32-chars
    expiration: 86400000  # 24 hours in milliseconds
  cors:
    allowed-origins: http://localhost:3000,http://localhost:8080
    allowed-methods: GET,POST,PUT,DELETE,OPTIONS,PATCH
    allowed-headers: "*"
    allow-credentials: true
  upload:
    video-dir: uploads/videos
    max-file-size: 5368709120  # 5GB in bytes
  ytdlp:
    enabled: true
    path: yt-dlp
  ffmpeg:
    enabled: true
    path: ffmpeg
  audio:
    output-dir: uploads/audio
    format: mp3
    bitrate: 128k
  whisper:
    enabled: true
    service-url: http://localhost:5000
  chunking:
    min-size: 50          # Minimum words per chunk
    target-size: 500      # Target words per chunk
    max-size: 1000        # Maximum words per chunk
  llm:
    # OpenAI Configuration (Legacy - not used with Ollama)
    enabled: false
    api-key: ${OPENAI_API_KEY:your-openai-api-key-here}
    api-url: https://api.openai.com/v1/chat/completions
    model: gpt-3.5-turbo
    max-tokens: 2000
    temperature: 0.7
    timeout: 30
  
  ollama:
    # Ollama Local LLM Configuration (ACTIVE)
    enabled: true
    api-url: http://localhost:11434
    model: llama3                    # Main model: llama3, mistral, qwen2.5, neural-chat, dolphin-mixtral
    max-tokens: 2000
    temperature: 0.7
    timeout: 120                     # Local models may take longer
    # Alternative models to try:
    # - llama3: Most capable, good for complex tasks (7B/13B parameters)
    # - mistral: Faster, good for simple tasks (7B parameters)
    # - qwen2.5: Good for structured output like JSON (7B/32B parameters)
    # - neural-chat: Optimized for conversational tasks (7B parameters)
    # - dolphin-mixtral: Very capable MoE model (47B parameters, needs 40GB RAM)

  # Step 18: Local Embeddings Configuration
  embeddings:
    enabled: true
    api-url: http://localhost:11434
    model: nomic-embed-text          # Local embedding model (768-dimensional vectors)

  # Step 19: ChromaDB Vector Storage Configuration
  chromadb:
    api-url: http://localhost:8000
    collection-name: video-embeddings

  # Step 23: Semantic Search Configuration
  semantic-search:
    top-k: 10                        # Default number of results to return
    similarity-threshold: 0.3        # Minimum cosine similarity (0.0-1.0)
    include-context: true            # Include surrounding chunks as context
    context-window: 1                # Number of surrounding chunks to include

